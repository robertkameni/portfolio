<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Robert Kameni Namou | Technical Lead, Angular frontend</title>
    <meta name="description" content="CV and portfolio for Robert Kameni Namou, Technical Lead and frontend engineer. Angular and full stack, with project write-ups and contact details." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f2f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141516" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The first screen is set in Instrument Sans; preload it from the HTML
         instead of letting the render-blocking stylesheet parse discover it,
         which costs a round trip on a phone. The fonts live in /fonts/ with
         stable names for exactly this reason: build output is content-hashed,
         so it cannot be preloaded from here.

         The hero portrait is not preloaded. It used to be, but a `<link
         rel="preload" as="image" imagesrcset>` is rewritten by the build's
         HTML pass, which turned every candidate into `/` and made the browser
         fetch the 62 KB document a second time as an image. The `<picture>`
         markup sits in the first kilobytes of the body, so the preload scanner
         finds the right candidate from `sizes` without help. -->
    <link rel="preload" as="font" href="/fonts/instrument-sans-latin-wght-normal.woff2" type="font/woff2" crossorigin />

    <!-- Sharing. A portfolio arrives as a pasted link in LinkedIn, Slack or
         WhatsApp, and without these it arrives as a bare line. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Robert Kameni Namou" />
    <meta property="og:title" content="Robert Kameni Namou, Technical Lead & frontend engineer" />
    <meta property="og:description" content="Technical Lead in frontend work with Angular and full stack delivery. Project notes and contact on his CV site." />
    <meta property="og:url" content="https://cv.lucastar.de/" />
    <meta property="og:image" content="https://cv.lucastar.de/assets/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Robert Kameni Namou, Technical Lead and Angular frontend engineer" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robert Kameni Namou, Technical Lead & frontend engineer" />
    <meta name="twitter:description" content="Technical Lead in frontend work with Angular and full stack delivery. Project notes and contact on his CV site." />
    <meta name="twitter:image" content="https://cv.lucastar.de/assets/og-card.png" />
    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        background: #f1f2f2;
        color: #101113;
        margin: 0;
        padding: 0;
        font-family: 'Instrument Sans Variable', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Tailwind's preflight already sets `a { color: inherit }` inside the base
     layer. Declaring it here as well would be unlayered, which outranks every
     `@layer utilities` colour class and silently breaks accent links. */

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f2f2;
      }

      /* Every public route is server-rendered, so the HTML the browser just
         parsed already contains the page inside <app-root>. Keeping an opaque
         overlay on top of it until the JS bundle boots hides the only thing
         worth painting: on a throttled phone that turned a 1.6s image into a
         5.1s LCP. Show the loader only while <app-root> is still empty, which
         is the client-only case (/admin, the project editor). */
      body:has(app-root > *) #boot-loader {
        display: none;
      }

      #boot-loader .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }

      #boot-loader .bar {
        width: 6rem;
        height: 1px;
        background: #d6d8d9;
        overflow: hidden;
      }

      #boot-loader .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 1px;
        background: #c0430f;
        animation: sweep 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      #boot-loader .title {
        font:
          500 11px/1.4 'JetBrains Mono Variable',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #63686d;
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }

      @media (prefers-color-scheme: dark) {
        body,
        #boot-loader {
          background: #141516;
          color: #eceded;
        }
        #boot-loader .bar {
          background: #2c2f31;
        }
        #boot-loader .bar::after {
          background: #ff8350;
        }
        #boot-loader .title {
          color: #858a8d;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="shell">
        <div class="bar"></div>
        <div class="title">Loading portfolio</div>
      </div>
    </div>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
