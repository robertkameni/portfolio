<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Robert Kameni's CV</title>
    <meta name="description" content="Portfolio of Robert Kameni: Technical Lead and frontend engineer (Angular, full stack). Selected projects, experience, and contact." />
    <base href="/portfolio/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f2f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141516" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Sharing. A portfolio arrives as a pasted link in LinkedIn, Slack or
         WhatsApp, and without these it arrives as a bare line. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Robert Kameni" />
    <meta property="og:title" content="Robert Kameni: Technical Lead & Frontend Engineer" />
    <meta property="og:description" content="Angular and full stack. Selected projects, experience, and contact." />
    <meta property="og:url" content="https://lucastar.de/portfolio/" />
    <meta property="og:image" content="https://lucastar.de/assets/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Robert Kameni, Technical Lead and Frontend Engineer" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robert Kameni: Technical Lead & Frontend Engineer" />
    <meta name="twitter:description" content="Angular and full stack. Selected projects, experience, and contact." />
    <meta name="twitter:image" content="https://lucastar.de/assets/og-card.png" />
    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        background: #f1f2f2;
        color: #101113;
        margin: 0;
        padding: 0;
        font-family: 'Instrument Sans Variable', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

  /* Tailwind's preflight already sets `a { color: inherit }` inside the base
     layer. Declaring it here as well would be unlayered, which outranks every
     `@layer utilities` colour class and silently breaks accent links. */

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f2f2;
      }

      #boot-loader .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }

      #boot-loader .bar {
        width: 6rem;
        height: 1px;
        background: #d6d8d9;
        overflow: hidden;
      }

      #boot-loader .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 1px;
        background: #c0430f;
        animation: sweep 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      #boot-loader .title {
        font:
          500 11px/1.4 'JetBrains Mono Variable',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #63686d;
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }

      @media (prefers-color-scheme: dark) {
        body,
        #boot-loader {
          background: #141516;
          color: #eceded;
        }
        #boot-loader .bar {
          background: #2c2f31;
        }
        #boot-loader .bar::after {
          background: #ff8350;
        }
        #boot-loader .title {
          color: #858a8d;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="shell">
        <div class="bar"></div>
        <div class="title">Loading portfolio</div>
      </div>
    </div>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
