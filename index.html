<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Robert Kameni's CV</title>
  <meta
    name="description"
    content="Portfolio of Robert Kameni — Technical Lead & frontend engineer (Angular, full stack). Selected projects, experience, and contact."
  />
  <base href="/portfolio/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <style>
    html, body {
      height: 100%
    }

    body {
      background: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(34, 197, 94, .14), transparent 40%), #000
    }

    #boot-loader .shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      color: #fff;
      text-align: center
    }

    #boot-loader .dot {
      width: .75rem;
      height: .75rem;
      border-radius: 9999px;
      background: #22c55e;
      box-shadow: 0 0 24px rgba(34, 197, 94, .7);
      animation: pulse 1.2s ease-in-out infinite
    }

    #boot-loader .title {
      font: 700 14px/1.2 Inter, system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #22c55e
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(.85);
        opacity: .55
      }
      50% {
        transform: scale(1);
        opacity: 1
      }
    }
  </style>
</head>
<body>
<div id="boot-loader" aria-hidden="true">
  <div class="shell">
    <div class="dot"></div>
    <div class="title">Loading portfolio</div>
  </div>
</div>
<app-root></app-root>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
