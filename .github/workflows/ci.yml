name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Angular 22 requires ^22.22.3 || ^24.15.0 || >=26.0.0
          node-version: 24.15.0
          cache: npm

      # Mirrors vercel.json installCommand (`npm install`). Avoid `npm ci` here: a lockfile
      # generated on Windows can omit Linux optional deps (@parcel/watcher, @emnapi/*) and
      # fail npm ci on ubuntu-latest with "Missing ... from lock file".
      - name: Install dependencies (npm install + Prisma via postinstall)
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript (app + specs)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:ci

      # Mirrors vercel.json buildCommand
      - name: Production build (Vite + Analog server)
        env:
          BUILD_PRESET: vercel
        run: npm run build

      - name: Verify Vercel Build Output API bundle
        run: node scripts/ensure-vercel-build-output.mjs

      - name: Where deployment appears
        run: |
          echo "::notice title=Vercel deployment::This workflow only validates the build."
          echo "Pushes to main still trigger deploys through the Vercel GitHub integration (Project → Settings → Git)."
          echo "Open the Vercel dashboard or the separate Deployment checks on the commit for build/deploy logs."
