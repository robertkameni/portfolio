name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies (npm install + Prisma via postinstall)
        run: npm install

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Prettier format fix
        run: npm run format:fix

      - name: Commit and push formatting changes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --exit-code; then
            echo "No formatting changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply Prettier formatting"
            git push
          fi

      - name: Prettier format check (non-blocking)
        run: npm run format:check
        continue-on-error: true

      - name: TypeScript (app + specs)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:ci

      # Mirrors vercel.json buildCommand
      - name: Production build (Vite + Analog server)
        env:
          BUILD_PRESET: vercel
        run: npm run build

      - name: Bundle size budgets
        run: npm run check:bundles

      - name: Verify Vercel Build Output API bundle
        run: node scripts/ensure-vercel-build-output.mjs

      - name: Where deployment appears
        run: |
          echo "::notice title=Vercel deployment::This workflow only validates the build."
          echo "Pushes to main still trigger deploys through the Vercel GitHub integration (Project → Settings → Git)."
          echo "Open the Vercel dashboard or the separate Deployment checks on the commit for build/deploy logs."
