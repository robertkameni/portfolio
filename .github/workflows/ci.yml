name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Mirrors vercel.json installCommand
      - name: Install dependencies
        run: npm install

      - name: Lint, typecheck, and tests
        run: npm run verify

      # Mirrors vercel.json buildCommand (BUILD_PRESET + ensure output)
      - name: Build
        env:
          BUILD_PRESET: vercel
        run: npm run build && node scripts/ensure-vercel-build-output.mjs
  