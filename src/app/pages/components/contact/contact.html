<section id="contact" trackBehavior="contact_viewed" class="bg-paper-2 section">
  <div class="page-shell">
    <div class="grid grid-cols-1 gap-12 lg:grid-cols-[5fr_7fr] lg:gap-20">
      <div class="min-w-0">
        <h2 class="type-h2">{{ adaptiveTitle() }}</h2>
        <p class="mt-4 max-w-[40ch] text-ink-2">{{ adaptiveDescription() }}</p>

        <dl class="mt-10 divide-y divide-rule border-t border-rule">
          @for (feature of data().features; track feature.title; let i = $index) {
          <div data-stagger [style.--i]="i + 1" class="py-5">
            <dt class="type-h3">{{ feature.title }}</dt>
            <dd class="mt-1 text-ink-2">{{ feature.description }}</dd>
          </div>
          }
        </dl>
      </div>

      <!-- The form is the same right rail as focus and about, not a card on a
           card. Its fields already draw their own rules, so a box around them
           only added a second frame. -->
      <div class="min-w-0 lg:border-l lg:border-rule lg:pl-12">
        <form (submit)="submit($event)" class="flex flex-col gap-8" novalidate data-stagger style="--i: 2">
          @if (statusMessage(); as msg) {
          <status-alert [type]="statusType()">{{ msg }}</status-alert>
          }

          <form-field [control]="form.name()" errorId="contact-name-error">
            <label class="type-meta text-ink-3" for="contact-name">{{ copy().contact.nameLabel }}</label>
            <input
              id="contact-name"
              type="text"
              autocomplete="name"
              [formField]="form.name"
              [placeholder]="copy().contact.placeholderName"
              [attr.aria-invalid]="form.name().touched() && form.name().invalid() ? 'true' : null"
              [attr.aria-describedby]="form.name().touched() && form.name().invalid() ? 'contact-name-error' : null"
              class="field"
            />
          </form-field>

          <form-field [control]="form.email()" errorId="contact-email-error">
            <label class="type-meta text-ink-3" for="contact-email">{{ copy().contact.emailLabel }}</label>
            <input
              id="contact-email"
              type="email"
              autocomplete="email"
              [formField]="form.email"
              [placeholder]="copy().contact.placeholderEmail"
              [attr.aria-invalid]="form.email().touched() && form.email().invalid() ? 'true' : null"
              [attr.aria-describedby]="form.email().touched() && form.email().invalid() ? 'contact-email-error' : null"
              class="field"
            />
          </form-field>

          <form-field [control]="form.message()" errorId="contact-message-error">
            <label class="type-meta text-ink-3" for="contact-message">{{ copy().contact.messageLabel }}</label>
            <textarea
              id="contact-message"
              [formField]="form.message"
              [placeholder]="adaptivePlaceholder()"
              rows="4"
              [attr.aria-invalid]="form.message().touched() && form.message().invalid() ? 'true' : null"
              [attr.aria-describedby]="form.message().touched() && form.message().invalid() ? 'contact-message-error' : null"
              class="field resize-none"
            ></textarea>
          </form-field>

          <button
            type="submit"
            [disabled]="!form().valid() || isSubmitting()"
            class="mt-2 inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-base bg-accent px-6 py-3 font-medium text-paper transition-colors duration-150 hover:bg-[color-mix(in_srgb,var(--color-accent)_88%,black)] active:translate-y-px disabled:cursor-not-allowed disabled:opacity-50 md:w-auto"
          >
            {{ isSubmitting() ? copy().contact.sendingLabel : adaptiveButtonText() }}
            <span aria-hidden="true">&#8594;</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
