<section trackBehavior="contact_viewed" class="flex px-4 py-4 md:py-6 justify-center text-white">
  <div class="w-full max-w-6xl border bg-[#020a04] border-[#0f2e15] rounded-2xl p-6 md:p-10 shadow-2xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 xs:gap-12">
      <div class="flex flex-col justify-center text-left">
        <h2 class="text-primary text-4xl font-bold mb-4">{{ adaptiveTitle() }}</h2>
        <p class="text-gray-300 mb-10 text-lg">{{ adaptiveDescription() }}</p>

        <dl class="mt-10 divide-y divide-rule border-t border-rule">
          @for (feature of data().features; track feature.title) {
          <div class="py-4">
            <dt class="type-h3">{{ feature.title }}</dt>
            <dd class="mt-1 text-ink-2">{{ feature.description }}</dd>
          </div>
          }
        </dl>
      </div>

      <div class="min-w-0">
        <form (submit)="submit($event)" class="flex flex-col gap-8" novalidate>
          @if (statusMessage(); as msg) {
          <status-alert [type]="statusType()">{{ msg }}</status-alert>
          }

          <form-field [control]="form.name()">
            <label class="type-meta text-ink-3" for="contact-name">{{ copy().contact.nameLabel }}</label>
            <input id="contact-name" type="text" autocomplete="name" [formField]="form.name" [placeholder]="copy().contact.placeholderName" class="field" />
          </form-field>

          <form-field [control]="form.email()">
            <label class="type-meta text-ink-3" for="contact-email">{{ copy().contact.emailLabel }}</label>
            <input id="contact-email" type="email" autocomplete="email" [formField]="form.email" [placeholder]="copy().contact.placeholderEmail" class="field" />
          </form-field>

          <form-field [control]="form.message()">
            <label class="type-meta text-ink-3" for="contact-message">{{ copy().contact.messageLabel }}</label>
            <textarea
              id="contact-message"
              [formField]="form.message"
              [placeholder]="adaptivePlaceholder()"
              rows="4"
              class="field resize-none"
            ></textarea>
          </form-field>

          <button
            type="submit"
            [disabled]="!form().valid() || isSubmitting()"
            class="mt-2 inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-base bg-accent px-6 py-3 font-medium text-paper transition-colors duration-150 hover:bg-[color-mix(in_srgb,var(--color-accent)_88%,black)] active:translate-y-px disabled:cursor-not-allowed disabled:opacity-50 md:w-auto"
          >
            {{ isSubmitting() ? copy().contact.sendingLabel : adaptiveButtonText() }}
            <span aria-hidden="true">&#8594;</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
