<section class="flex pb-12 justify-center text-white">
  <div class="w-full max-w-6xl border bg-[#020a04] border-[#0f2e15] rounded-2xl p-8 md:p-12 shadow-2xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">

      <div class="flex flex-col justify-center text-left">
        <h2 class="text-primary text-4xl font-bold mb-4">{{ data().title }}</h2>
        <p class="text-gray-300 mb-10 text-lg">{{ data().description }}</p>

        <div class="space-y-8 text-left">
          @for (feature of data().features; track feature.title) {
            <div class="flex items-start">
              <div class="bg-[#0a2912] p-2 rounded-full mr-4 shrink-0 mt-1">
                <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="feature.iconPath"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-white font-bold text-lg">{{ feature.title }}</h4>
                <p class="text-gray-400 text-sm mt-1">{{ feature.description }}</p>
              </div>
            </div>
          }
        </div>
      </div>

      <div class="bg-surface border border-[#143c1a] rounded-xl p-6 flex flex-col justify-center items-center text-center shadow-lg">
        <form (submit)="submit($event)" class="flex flex-col gap-4 w-full">
          <input
            type="text"
            [formField]="form.name"
            placeholder="Name"
            class="p-4 bg-[#0a2912] border border-[#143c1a] rounded-lg text-white focus:outline-none focus:border-primary transition-colors"
          />
          <input
            type="email"
            [formField]="form.email"
            placeholder="E-Mail"
            class="p-4 bg-[#0a2912] border border-[#143c1a] rounded-lg text-white focus:outline-none focus:border-primary transition-colors"
          />
          <textarea
            [formField]="form.message"
            placeholder="Message"
            rows="4"
            class="p-4 bg-[#0a2912] border border-[#143c1a] rounded-lg text-white focus:outline-none focus:border-primary transition-colors resize-none"
          ></textarea>
          <button
            type="submit"
            class="cursor-pointer bg-primary hover:bg-[#16a34a] text-black font-bold py-4 px-6 rounded-lg transition-colors mt-2"
          >
            Send Message
          </button>
        </form>
      </div>

    </div>
  </div>
</section>
