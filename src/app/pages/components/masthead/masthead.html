<section trackBehavior="intro_viewed" class="pb-16 pt-10 md:pb-24 md:pt-16">
  <div class="page-shell">
    <div class="grid grid-cols-1 items-start gap-10 md:grid-cols-[minmax(0,1.3fr)_minmax(15rem,0.7fr)] md:gap-16 lg:items-end lg:gap-20">
      <div class="min-w-0">
        <h1 class="type-display enter" style="--i: 0">{{ name() }}</h1>

        <p class="type-lead enter mt-6 max-w-[22ch] text-ink" style="--i: 1">{{ role() }}</p>

        <!-- The rule turns the byline into a block: name, role, then the
             supporting text and the exits. Without it the four lines were one
             undifferentiated paragraph at display weight. -->
        <div class="enter mt-8 border-t border-rule pt-6" style="--i: 2">
          <p class="max-w-[46ch] text-ink-2">{{ description() }}</p>

          <div class="mt-8 flex flex-wrap items-center gap-x-8 gap-y-3">
            <a href="#projects-section" class="hero-cta tap-area inline-flex items-center whitespace-nowrap bg-ink px-4 py-2 text-paper hover:bg-accent active:translate-y-px">
              {{ copy().projects.title }}
            </a>

            @if (socials().length > 0) {
            <ul class="flex flex-wrap items-center gap-x-8 gap-y-3">
              @for (social of socials(); track social.url) {
              <li>
                <a
                  [href]="social.url"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.aria-label]="socialAriaLabel(social.platform)"
                  class="tap-area type-meta text-ink-3 underline decoration-transparent underline-offset-4 transition-colors duration-150 hover:text-accent hover:decoration-current"
                >
                  {{ social.platform }}
                </a>
              </li>
              }
            </ul>
            }
          </div>
        </div>
      </div>

      <!-- No entrance animation on this block. It holds the LCP element, and an
           `opacity: 0` start means the largest paint cannot be reported until
           the animation runs. The portrait is above the fold, so it is simply
           there. -->
      <div class="md:justify-self-end">
        <!-- The portrait is the LCP element on a phone. It is offered at three
             widths so the browser fetches the smallest file that still covers
             its device pixels: a 412pt phone at 1.75x needs 560px, not the
             711px fallback (74 KB). The JPEG srcset stays for browsers that
             support neither AVIF nor WebP. -->
        <picture>
          <source type="image/avif" srcset="/assets/lucas-400.avif 400w, /assets/lucas-600.avif 600w, /assets/lucas-800.avif 711w" sizes="(min-width: 768px) 30vw, 320px" />
          <source type="image/webp" srcset="/assets/lucas-400.webp 400w, /assets/lucas-600.webp 600w, /assets/lucas-800.webp 711w" sizes="(min-width: 768px) 30vw, 320px" />
          <img
            src="/assets/lucas-600.jpg"
            srcset="/assets/lucas-400.jpg 400w, /assets/lucas-600.jpg 600w, /assets/lucas-800.jpg 800w"
            width="480"
            height="600"
            sizes="(min-width: 768px) 30vw, 320px"
            [alt]="name()"
            decoding="async"
            loading="eager"
            fetchpriority="high"
            class="portrait hero-portrait aspect-4/5 w-full max-w-[20rem] object-cover object-top md:max-w-none"
          />
        </picture>
      </div>
    </div>
  </div>
</section>
