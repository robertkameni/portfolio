<section id="focus" trackBehavior="hero_viewed" class="edge-top section">
  <div class="page-shell">
    <h2 class="type-h2">{{ copy().focus.title }}</h2>

    <!-- Two columns of one document. The second is separated by a hairline
         rather than a tinted panel, so focus, about and contact all share the
         same right-rail device instead of three different boxes. -->
    <div class="mt-8 grid grid-cols-1 gap-10 md:mt-12 lg:grid-cols-[minmax(0,1.45fr)_minmax(15rem,0.72fr)] lg:gap-16">
      @for (card of adaptiveCards(); track card.title; let i = $index) {
      <article trackBehavior="hero_card_viewed_{{ card.title }}" data-stagger [style.--i]="i" [class]="i === 1 ? 'min-w-0 lg:border-l lg:border-rule lg:pl-10' : 'min-w-0'">
        <h3 class="text-(length:--text-lead) font-medium leading-snug text-ink">{{ card.title }}</h3>
        <p class="type-meta mt-3 text-ink-3">{{ card.subtitle }}</p>
        <p class="mt-4 max-w-[42ch] text-ink-2">{{ card.description }}</p>

        <ul class="mt-6 divide-y divide-rule border-t border-rule">
          @for (item of card.items; track item.title; let j = $index) {
          <li data-stagger [style.--i]="i + j + 1" class="py-5">
            <h3 class="type-h3">{{ item.title }}</h3>
            <p class="mt-1 text-ink-2">{{ item.description }}</p>
          </li>
          }
        </ul>
      </article>
      }
    </div>
  </div>
</section>
