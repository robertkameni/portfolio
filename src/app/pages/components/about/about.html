<section trackBehavior="about_viewed" class="py-4 md:py-10 flex justify-center text-white">
  <div class="max-w-6xl w-full mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-12 w-full items-start">
      <div class="md:col-span-5 flex justify-center md:justify-start md:self-start">
        <div class="relative w-full max-w-[260px] md:max-w-sm aspect-3/4 rounded-lg overflow-hidden border border-gray-800 shadow-[0_0_30px_rgba(34,197,94,0.1)]">
          <img
            src="/assets/lucas-600.jpg"
            srcset="/assets/lucas-400.jpg 400w, /assets/lucas-600.jpg 600w, /assets/lucas-800.jpg 800w"
            width="711"
            height="1067"
            alt="Robert Kameni"
            decoding="async"
            loading="lazy"
            fetchpriority="low"
            sizes="(max-width: 768px) min(92vw, 384px), 384px"
            class="object-cover w-full h-full grayscale hover:grayscale-0 transition-[filter] duration-500"
          />
        </div>
      </div>

      <div class="md:col-span-7 flex flex-col justify-start md:self-start">
        <div class="mb-6 flex flex-col items-baseline">
          <h2 class="text-4xl md:text-5xl font-bold text-primary mb-2">{{ adaptiveTitle() }}</h2>
          <div class="h-1 w-16 bg-white"></div>
        </div>

        <div class="space-y-4 mb-8 text-gray-300 leading-relaxed text-sm md:text-base text-left">
          @for (paragraph of visibleParagraphs(); track $index) {
          <p>{{ paragraph }}</p>
          } @if (hasCollapsedPreview()) {
          <button type="button" class="text-primary font-bold hover:underline cursor-pointer" (click)="toggleAbout()">
            {{ isExpanded() ? copy().common.showLess : copy().common.showMore }}
          </button>
          }
        </div>

        <div class="space-y-6 text-left">
          @for (item of data().highlights; track item.title) {
          <div class="flex items-start">
            <div class="bg-[#0a2912] p-2 rounded-full mr-4 shrink-0 mt-1">
              <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-white font-bold text-base">{{ item.title }}</h3>
              <p class="text-gray-400 text-sm mt-1">{{ item.description }}</p>
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
