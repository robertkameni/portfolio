<section trackBehavior="about_viewed" class="flex px-4 py-4 md:py-12 justify-center text-white">
  <div class="about-glass w-full max-w-6xl p-6 md:p-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
      <div class="flex flex-col text-left">
        <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center">
          <div
            class="relative size-20 md:size-24 shrink-0 overflow-hidden rounded-full border border-[#143c1a] shadow-[0_0_24px_rgba(34,197,94,0.12)]"
          >
            <img
              src="/assets/lucas-600.jpg"
              srcset="/assets/lucas-400.jpg 400w, /assets/lucas-600.jpg 600w, /assets/lucas-800.jpg 800w"
              width="96"
              height="96"
              alt="Robert Kameni"
              decoding="async"
              loading="lazy"
              fetchpriority="low"
              sizes="96px"
              class="object-cover object-top w-full h-full grayscale hover:grayscale-0 transition-[filter] duration-500"
            />
          </div>

          <div class="min-w-0 flex flex-col items-baseline">
            <h2 class="text-3xl md:text-4xl font-bold text-primary mb-2 text-balance">{{ adaptiveTitle() }}</h2>
            <div class="h-1 w-16 bg-white"></div>
          </div>
        </div>

        <div class="space-y-4 text-gray-300 leading-relaxed text-sm md:text-base">
          @for (paragraph of visibleParagraphs(); track $index) {
          <p>{{ paragraph }}</p>
          }
        </div>

        @if (hasCollapsedPreview()) {
        <div class="mt-4">
          <button
            type="button"
            class="text-primary font-bold hover:underline cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            (click)="toggleAbout()"
          >
            {{ isExpanded() ? copy().common.showLess : copy().common.showMore }}
          </button>
        </div>
        }
      </div>

      <div class="flex flex-col justify-center space-y-8 text-left">
        @for (item of data().highlights; track item.title) {
        <div class="flex items-start">
          <div class="bg-[#0a2912] p-2 rounded-full mr-4 shrink-0 mt-1">
            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath"></path>
            </svg>
          </div>
          <div>
            <h3 class="text-white font-bold text-lg">{{ item.title }}</h3>
            <p class="text-gray-400 text-sm mt-1">{{ item.description }}</p>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</section>
