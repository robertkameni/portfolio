<div fadeIn class="relative z-10001 flex min-h-screen items-center justify-center bg-paper p-4">
  <div class="admin-card w-full max-w-md">
    <h1 class="admin-h1 text-center text-[1.5rem]">{{ copy().adminLogin.title }}</h1>
    <form (ngSubmit)="submit()" class="mt-6 space-y-6">
      <div>
        <label class="type-meta text-ink-3" for="admin-login-email">{{ copy().adminLogin.email }}</label>
        <input id="admin-login-email" type="email" [(ngModel)]="email" name="email" required class="field" />
      </div>
      <div>
        <label class="type-meta text-ink-3" for="admin-login-password">{{ copy().adminLogin.password }}</label>
        <input id="admin-login-password" type="password" [(ngModel)]="password" name="password" autocomplete="current-password" required class="field" />
      </div>
      @if (errorMessage()) {
      <p class="text-center text-[0.875rem] text-accent">{{ errorMessage() }}</p>
      }
      <button type="submit" [disabled]="isLoading()" class="admin-btn admin-btn-primary mt-6 w-full">
        {{ isLoading() ? copy().adminLogin.loggingIn : copy().adminLogin.login }}
      </button>
    </form>
  </div>
</div>

@if (toastMessage()) {
<div role="status" aria-live="polite" class="fixed right-6 bottom-6 z-10002">
  <div class="rounded-base bg-accent px-4 py-2 text-paper">{{ toastMessage() }}</div>
</div>
}
