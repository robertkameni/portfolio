<div class="p-4 md:p-8 text-ink">
  <div class="flex items-center justify-between gap-4">
    <h1 class="admin-h1">Intelligence Dashboard</h1>
    <button (click)="navigateHome()" class="admin-btn shrink-0">{{ copy().devProxy.home }}</button>
  </div>

  <div class="mt-8 grid grid-cols-1 gap-6 md:grid-cols-3">
    <div class="admin-card">
      <h2 class="admin-h2">Live Visitors</h2>
      <p class="type-metric mt-2 text-ink">0</p>
    </div>
    <div class="admin-card">
      <h2 class="admin-h2">New Messages</h2>
      <p class="type-metric mt-2 text-ink">{{ newMessagesCount() }}</p>
    </div>
    <div class="admin-card">
      <h2 class="admin-h2">AI Insights</h2>
      <p class="type-metric mt-2 text-ink">0</p>
    </div>
  </div>

  <h2 class="admin-h2 mt-10 mb-4">Quick Navigation</h2>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <a routerLink="/admin/projects" class="admin-card group">
      <p class="admin-h2 text-accent group-hover:underline">Projects →</p>
      <p class="mt-1 text-[0.875rem] text-ink-2">Create and manage portfolio projects</p>
    </a>
    <a routerLink="/admin/messages" class="admin-card group">
      <p class="admin-h2 text-accent group-hover:underline">Messages →</p>
      <p class="mt-1 text-[0.875rem] text-ink-2">View contact form submissions</p>
    </a>
    <a routerLink="/admin/intelligence" class="admin-card group">
      <p class="admin-h2 text-accent group-hover:underline">Intelligence →</p>
      <p class="mt-1 text-[0.875rem] text-ink-2">AI visitor analysis and insights</p>
    </a>
  </div>
</div>
