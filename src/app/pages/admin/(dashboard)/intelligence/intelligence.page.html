<div class="p-8 text-white">
  <h1 class="text-3xl font-bold mb-6 text-primary">Visitor Intelligence</h1>
  <div class="bg-surface border border-[#143c1a] rounded-xl p-6 shadow-lg">
    @if (loading()) {
    <p class="text-gray-400">Loading AI insights...</p>
    } @else if (error()) {
    <p class="text-red-300">{{ error() }}</p>
    <button (click)="loadInsights()" class="mt-3 text-sm text-primary hover:underline">Retry</button>
    } @else if (insightCount() === 0) {
    <p class="text-gray-400">No AI insights available yet.</p>
    } @else {
    <p class="text-gray-200">
      <span class="text-primary font-semibold">{{ insightCount() }}</span>
      AI insight{{ insightCount() === 1 ? '' : 's' }} available.
    </p>
    }
  </div>
</div>
