<div class="p-4 text-ink md:p-8">
  <h1 class="admin-h1 mb-6">Visitor Intelligence</h1>
  <div class="admin-card">
    @if (loading()) {
    <p class="text-ink-2">Loading AI insights...</p>
    } @else if (error()) {
    <p class="text-accent">{{ error() }}</p>
    <button (click)="loadInsights()" class="admin-link mt-3">Retry</button>
    } @else if (insightCount() === 0) {
    <p class="text-ink-2">No AI insights available yet.</p>
    } @else {
    <p class="text-ink-2">
      <span class="font-semibold text-accent">{{ insightCount() }}</span>
      AI insight{{ insightCount() === 1 ? '' : 's' }} available.
    </p>
    }
  </div>
</div>
