<form (submit)="submit($event)" class="admin-card space-y-4">
  <h2 class="admin-h2 mb-4">{{ formTitle() }}</h2>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div>
      <label class="type-meta text-ink-3" for="admin-project-title">{{ copy().projectForm.titleLabel }}</label>
      <input
        id="admin-project-title"
        [formField]="projectForm.title"
        type="text"
        class="field"
        [attr.aria-invalid]="projectForm.title().touched() && !projectForm.title().valid() ? 'true' : null"
      />
      @if (projectForm.title().touched() && projectForm.title().errors().length > 0) {
      <p class="mt-1 text-[0.75rem] text-accent">{{ projectForm.title().errors()[0]?.message }}</p>
      }
    </div>
    <div>
      <label class="type-meta text-ink-3" for="admin-project-slug">{{ copy().projectForm.slugLabel }}</label>
      <input
        id="admin-project-slug"
        [formField]="projectForm.slug"
        type="text"
        class="field"
        [attr.aria-invalid]="projectForm.slug().touched() && !projectForm.slug().valid() ? 'true' : null"
      />
      @if (projectForm.slug().touched() && projectForm.slug().errors().length > 0) {
      <p class="mt-1 text-[0.75rem] text-accent">{{ projectForm.slug().errors()[0]?.message }}</p>
      }
    </div>
  </div>

  <div>
    <label class="type-meta text-ink-3" for="admin-project-description">{{ copy().projectForm.descriptionLabel }}</label>
    <textarea id="admin-project-description" [formField]="projectForm.description" rows="3" class="field resize-none"></textarea>
  </div>

  <div>
    <label class="type-meta text-ink-3" for="admin-project-content">{{ copy().projectForm.contentMarkdownLabel }}</label>
    <textarea id="admin-project-content" [formField]="projectForm.contentMarkdown" rows="10" class="field min-h-32 resize-y font-mono"></textarea>
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div>
      <label class="type-meta text-ink-3" for="admin-project-cover">{{ copy().projectForm.coverImageUrlLabel }}</label>
      <input id="admin-project-cover" [formField]="projectForm.coverImageUrl" type="text" class="field" />
    </div>
    <div>
      <label class="type-meta text-ink-3" for="admin-project-tags">{{ copy().projectForm.tagsLabel }}</label>
      <input id="admin-project-tags" [formField]="projectForm.tags" type="text" [placeholder]="copy().projectForm.tagsPlaceholder" class="field" />
    </div>
  </div>

  <div>
    <label class="type-meta text-ink-3" for="admin-project-url">{{ copy().projectForm.projectUrlLabel }}</label>
    <input id="admin-project-url" [formField]="projectForm.projectUrl" type="url" [placeholder]="copy().projectForm.projectUrlPlaceholder" class="field" />
  </div>

  <div class="flex items-center gap-3">
    <input [formField]="projectForm.isPublished" type="checkbox" id="admin-project-published" class="h-4 w-4 accent-accent" />
    <label for="admin-project-published" class="text-[0.875rem] text-ink-2">{{ effectivePublishLabel() }}</label>
  </div>

  <div class="flex justify-end gap-3">
    <button type="button" (click)="cancel.emit()" class="admin-btn">{{ copy().projectForm.cancel }}</button>
    <button type="submit" [disabled]="!isFormValid() || isSubmitting()" class="admin-btn admin-btn-primary disabled:opacity-50">
      {{ isSubmitting() ? submittingLabel() : submitLabel() }}
    </button>
  </div>
</form>
